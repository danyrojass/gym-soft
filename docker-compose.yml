services:
  db:
    image: postgres:16-alpine
    container_name: gymsoft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymsoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymsoft}
      POSTGRES_DB: ${POSTGRES_DB:-gymsoft}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymsoft} -d ${POSTGRES_DB:-gymsoft}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the web app in Docker (for reproducible local env / migration parity)
  # Usage: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymsoft-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-gymsoft}:${POSTGRES_PASSWORD:-gymsoft}@db:5432/${POSTGRES_DB:-gymsoft}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-to-a-long-random-secret}
      GYM_TIMEZONE: ${GYM_TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
